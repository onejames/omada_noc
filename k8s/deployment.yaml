apiVersion: apps/v1
kind: Deployment
metadata:
  name: noc-dash
  labels:
    app: noc-dash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noc-dash
  template:
    metadata:
      labels:
        app: noc-dash
    spec:
      containers:
        - name: noc-dash
          image: noc_dash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: omada-credentials
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
